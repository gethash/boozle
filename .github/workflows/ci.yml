name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Linux build deps (Ebiten needs OpenGL + X11 headers)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libgl1-mesa-dev \
            libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libxxf86vm-dev \
            libxkbcommon-dev

      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      - name: go mod tidy
        if: runner.os == 'Linux'
        run: go mod tidy -diff

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        if: runner.os == 'Linux'
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.2 ./...

      - name: go build
        run: go build ./...

      - name: go test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a go test -race -count=1 ./...

      - name: go test
        if: runner.os != 'Linux'
        run: go test -race -count=1 ./...
